{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<article class="post">
	<h1>{{ page.title }}</h1>
	{% if page.date %}
	<time class="post-date" datetime="{{ page.date }}">{{ page.date | date(format="%B %-d, %Y") }}</time>
	{% endif %}
	{{ page.content | safe }}
</article>
{% endblock content %}
